# Builds the kernel, runs the host tests and checks code style on every push
# and pull request. See docs/development.md.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust the checkout (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build
        run: make -j"$(nproc)"
      - name: Memory usage
        run: make size
      - name: Check the bundled FPGA firmware
        run: |
          echo "b23f6eae  assets/firmware/omega_fpga.bin" > /tmp/expected
          python3 -c "import zlib,sys; print('%08x  %s' % (zlib.crc32(open(sys.argv[1],'rb').read()), sys.argv[1]))" \
            assets/firmware/omega_fpga.bin | diff - /tmp/expected
      - uses: actions/upload-artifact@v4
        with:
          name: ezkernel-${{ github.sha }}
          path: |
            ezkernel.bin
            build/ezkernel.map
          if-no-files-found: error

  test:
    name: Host tests (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            packages: ""
          - cc: clang-18
            packages: clang-18 libclang-rt-18-dev # sanitizer runtime
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mtools dosfstools ${{ matrix.packages }}
      - name: Unit tests and UI simulator
        run: make test CC=${{ matrix.cc }}
      - name: Screenshots
        if: matrix.cc == 'gcc'
        run: make -C tests screenshots
      - uses: actions/upload-artifact@v4
        if: always() && matrix.cc == 'gcc'
        with:
          name: screenshots
          path: |
            tests/build/screens/
            tests/build/screens-failed/
          if-no-files-found: ignore

  lint:
    name: Style and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format-18 cppcheck
      - name: clang-format
        run: make format-check CLANG_FORMAT=clang-format-18
      - name: cppcheck
        run: make lint
      - name: Fonts match their sources
        run: python3 tools/make_font.py --all --check
      - name: Python tools compile
        run: python3 -m py_compile tools/*.py tests/sim/*.py
